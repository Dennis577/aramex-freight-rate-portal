# Netlify Build Configuration
# ─────────────────────────────────────────────────────────
# This file tells Netlify how to build and deploy the site.
# The build command injects secrets from environment variables.
#
# Required Netlify Environment Variables (set in Netlify UI):
#   SUPABASE_URL          — Supabase project URL
#   SUPABASE_ANON_KEY     — Supabase anon (public) key
#   ADMIN_PASSWORD_HASH   — SHA-256 hex of admin password
# ─────────────────────────────────────────────────────────

[build]
  command   = "sh scripts/inject-env.sh"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Cache Control Headers ─────────────────────────────────
# HTML files: never cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# JS files: versioned by build — short cache OK but disable for safety
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# CSS files: same
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
